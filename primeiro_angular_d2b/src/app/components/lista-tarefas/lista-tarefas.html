<section class="container-lista">
    <h2>Lista de Tarefas</h2>

    @if(ultimaConcluida()) {
       <p class="alerta-sucesso">
         Parabens! Você concluiu a tarefa <strong>{{ ultimaConcluida() }}</strong> com sucesso!
       </p>
    } @else {
        <p>Não há tarefas concluidas.</p>
    }

    <div class="lista">
        @for (item of tarefas(); track item.id) {
            <app-item-tarefa
                [tarefa]="item"
                (tarefaConcluida)="aoConcluirTarefa($event)"
            ></app-item-tarefa>
        }@empty {
            <p>Não há tarefas cadastradas.</p>
        }
    </div>


</section>
