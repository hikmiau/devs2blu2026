<article class="card-nave">
  <h2>{{ nome() }}</h2>
  <p>Tripulação: {{ tripulacao() }}</p>

  <div class="barra">
    <div
      class="combustivel"
      [style.width]="combustivel() + '%'"
      [style.background]="corBarra()"
    ></div>
  </div>

  <p>Combustível: {{ combustivel() }}%</p>
  <p>Status: {{ status() }}</p>

  @if (tripulacao() === 0) {
    <p>sem tripulação</p>
  }
</article>
