<section class="exercicio-12">
  <h1>Exercício 12 - Calculadora de Gorjeta</h1>
  
  <div class="entrada">
    <label>
      Valor da Conta: R$
      <input 
        type="number" 
        min="0" 
        step="0.01"
        [value]="valorConta()"
        (input)="aoMudarConta($event)"
      />
    </label>
  </div>

  <div class="entrada">
    <label>
      Número de Pessoas:
      <input 
        type="number" 
        min="1"
        [value]="numeroPessoas()"
        (input)="aoMudarPessoas($event)"
      />
    </label>
  </div>

  <div class="entrada">
    <label>
      Porcentagem de Gorjeta: {{ porcentagemGorjeta() }}%
    </label>
    <input 
      type="range" 
      min="0" 
      max="30"
      [value]="porcentagemGorjeta()"
      (input)="aoMudarGorjeta($event)"
    />
  </div>

  <div class="resultados">
    <div class="resultado-box">
      <h3>Valor da Gorjeta</h3>
      <p class="valor">R$ {{ valorGorjeta().toFixed(2) }}</p>
    </div>

    <div class="resultado-box">
      <h3>Total</h3>
      <p class="valor">R$ {{ totalComGorjeta().toFixed(2) }}</p>
    </div>

    <div class="resultado-box">
      <h3>Por Pessoa</h3>
      <p class="valor">R$ {{ porPessoa().toFixed(2) }}</p>
    </div>
  </div>
</section>
